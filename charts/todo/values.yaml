# Starea e in memoria procesului (vezi README -> Roadmap), deci o singura
# replica pentru demo. Cresterea la >1 cere Postgres + migrari.
replicaCount: 1

image:
  repository: ghcr.io/stefcosmin09-glitch/todo-app
  # Tag-ul imaginii. Gol = foloseste .Chart.AppVersion.
  # Pipeline-ul CI/CD il injecteaza cu --set, ca imaginea deployed sa fie
  # intotdeauna tracetabila la un commit concret.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Aplicatia nu apeleaza API-ul Kubernetes, deci tokenul nu e necesar.
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  annotations: {}

containerPort: 5000

# Fara limite, scheduler-ul nu are cum decide si pod-urile pot consuma tot
# nodul. Request-urile conteaza pentru QoS si pentru HPA.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# /healthz = procesul raspunde; /readyz = aplicatia poate servit trafic.
# Diferenta conteaza: daca aplicatia are DB-ul jos, vrei sa scada din Service,
# dar nu sa fie restartata de liveness probe.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

# Protejeaza pornirea lenta de livenessProbe, ca sa nu faca restart loop.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 12

autoscaling:
  enabled: false
  # Aliniat la replicaCount: starea e in memorie, deci nu scalezi orizontal
  # pana nu avem Postgres.
  minReplicas: 1
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  # Cu o singura replica, minAvailable: 1 ar bloca orice drain voluntar.
  # Reactivam dupa trecerea la Postgres + replicaCount > 1.
  enabled: false
  minAvailable: 1

# Evita ca toate replicile sa ajunga pe un singur nod inainte de un drain.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: todo
        app.kubernetes.io/instance: todo

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: todo.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: true
  # Namespace-uri din care se accepta trafic, in plus fata de namespace-ul
  # propriu. Adauga aici "ingress-nginx" daca controllerul de ingress ruleaza
  # intr-un namespace separat.
  additionalIngressNamespaces: []
  allowDNS: true

metrics:
  service:
    enabled: true
    port: 5000
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    # Namespace-ul in care ruleaza prometheus-operator (kube-prometheus-stack).
    # Fara acest label ServiceMonitor nu este descoperit de operator.
    labels:
      release: kube-prometheus-stack
    relabelings: []
    metricRelabelings: []

env:
  LOG_LEVEL: info
  PORT: "5000"
  PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus

# root filesystem este read-only, deci /tmp si directorul de metrici multiproces
# trebuie montate ca volume scrise.
extraVolumes: []
extraVolumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
