{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "todo.fullname" . }}
  labels:
    {{- include "todo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "todo.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Orice pod din namespace-ul release-ului: Prometheus, controllerul de
    # ingress (daca este in acelasi namespace), si pod-urile de test helm.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
    {{- range .Values.networkPolicy.additionalIngressNamespaces }}
    # De obicei controllerul de ingress ruleaza in namespace-ul "ingress-nginx",
    # care trebuie declarat explicit, altfel Ingress-ul nu va primi trafic.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - protocol: TCP
          port: {{ $.Values.containerPort }}
    {{- end }}
  egress:
    {{- if .Values.networkPolicy.allowDNS }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    # Nu exista alta regula de egress, deci orice iesire este blocata.
    # Cand aplicatia va avea o baza de date externa (roadmap P3), adauga aici
    # o regula catre portul 5432, cu exceptie pe IP-ul DB-ului.
{{- end }}
